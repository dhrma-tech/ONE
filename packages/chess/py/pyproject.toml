[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bobby"
version = "0.1.0"
description = "Pure-Python core for Bobby, a single-user AI chess learning app (runs under Pyodide)."
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["python-chess>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["bobby", "bobby.coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
